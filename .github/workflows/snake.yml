name: Generate profile assets

# Rebuilds the dynamic README art and publishes it to the `output` branch
# (the README references these via raw.githubusercontent.com):
#   * the contribution-graph snake (Platane/snk)
#   * the live swing-trading sparkline (from the website's portfolio CSV)
on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Contribution-graph snake (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Live trading sparkline (Frappé + Latte)
        run: python3 scripts/build_sparkline_svg.py --out dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
